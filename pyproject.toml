[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-trajectory-video-fusion"
version = "1.0.0"
description = "Aerial-video trajectory extraction with ground truth: NGSIM-rendered drone video, detection, ByteTrack, homography georeferencing, CLEAR-MOT evaluation, loop/video count fusion."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "pydantic>=2.6,<3", "matplotlib>=3.8", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]
yolo = ["ultralytics>=8.3"]
dev = ["pytest>=8.0"]

[project.scripts]
dronefusion = "dronefusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
